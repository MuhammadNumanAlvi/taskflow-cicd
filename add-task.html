<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Add Task</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Add New Task</h1>
    <p>Create a task with title, description, due date, and priorit.y</p>
  </header>

  <nav>
    <a href="index.html">Dashboard</a>
    <a href="add-task.html">Add Task</a>
    <a href="task-list.html">Task List</a>
    <a href="task-detail.html">Task Detail</a>
    <a href="about.html">About / Help</a>
  </nav>

  <main class="container">
    <section class="card">
      <h2>Task Details</h2>
      <form>
        <label for="title">Task Title</label>
        <input type="text" id="title" placeholder="Enter task title">

        <label for="description">Description</label>
        <textarea id="description" rows="5" placeholder="Write task details"></textarea>

        <label for="due-date">Due Date</label>
        <input type="date" id="due-date">

        <label for="priority">Priority</label>
        <select id="priority">
          <option>High</option>
          <option>Medium</option>
          <option>Low</option>
        </select>

        <button type="button">Save Task</button>
      </form>
    </section>
  </main>

  <footer>TaskFlow CI/CD Assignment - DevOps Fundamentals Spring 2026</footer>
  <script src="app.js"></script>
</body>
</html>
